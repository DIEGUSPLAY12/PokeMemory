<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeMemory</title>
  </head>
  <body>
    <header>
      <h1>PokeMemory</h1>
    </header>
    <main>
      <section id="profile-section">
        <form id="profile-form">
          <h2>Perfil del Jugador</h2>

          <p id="profile-general-error" class="error-message"></p>

          <div class="form-group">
            <label for="username-input">Nombre de usuario</label>
            <input type="text" id="username-input" name="username" autocomplete="off">
            <p id="username-error" class="error-message"></p>
          </div>

          <div class="form-group">
            <label for="pokemon-search-input">Buscar Pokémon</label>
            <input type="text" id="pokemon-search-input" name="pokemon-search" autocomplete="off" placeholder="Buscar Pokémon...">
            <p id="pokemon-error" class="error-message"></p>
            <ul id="pokemon-matches-list"></ul>
          </div>

          <div id="pokemon-preview-container">
            <img id="pokemon-preview-image" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Vista previa del Pokémon seleccionado">
            <span id="pokemon-preview-name"></span>
          </div>

          <button type="submit" id="profile-submit-btn">Crear perfil</button>
        </form>
      </section>
      <section id="game-section"></section>
      <section id="ranking-section"></section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
